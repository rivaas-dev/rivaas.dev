name: Update Benchmarks

on:
  repository_dispatch:
    types: [benchmark-update]

permissions:
  contents: write
  pull-requests: write

jobs:
  update-benchmarks:
    name: Update Benchmark Data
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Update benchmarks.json
        run: |
          mkdir -p src/public
          
          # Extract only the data needed for the landing page (top frameworks only)
          cat > src/public/benchmarks.json << 'EOF'
          {
            "updated": "${{ github.event.client_payload.updated }}",
            "go_version": "${{ github.event.client_payload.go_version }}",
            "goos": "${{ github.event.client_payload.goos }}",
            "goarch": "${{ github.event.client_payload.goarch }}",
            "cpu": "${{ github.event.client_payload.cpu }}",
            "scenarios": [
              {
                "name": "Static",
                "path": "/",
                "results": []
              },
              {
                "name": "OneParam",
                "path": "/users/:id",
                "results": []
              }
            ]
          }
          EOF
          
          # Use jq to filter and extract top frameworks from payload
          if command -v jq &> /dev/null; then
            echo '${{ toJson(github.event.client_payload) }}' | jq '{
              updated: .updated,
              go_version: .go_version,
              goos: .goos,
              goarch: .goarch,
              cpu: .cpu,
              scenarios: [
                (.scenarios[] | select(.name == "Static" or .name == "OneParam") | {
                  name: .name,
                  path: .path,
                  results: [.results[] | select(.framework == "Rivaas" or .framework == "Gin" or .framework == "Echo" or .framework == "StdMux" or .framework == "Chi" or .framework == "Hertz")]
                })
              ]
            }' > src/public/benchmarks.json
          fi

      - name: Create Pull Request
        uses: peter-evans/create-pull-request@v7
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          commit-message: "chore: update benchmark data"
          title: "chore: update benchmark data"
          body: |
            Automated benchmark update from rivaas repository.
            
            **Updated:** ${{ github.event.client_payload.updated }}
            **Go Version:** ${{ github.event.client_payload.go_version }}
            **CPU:** ${{ github.event.client_payload.cpu }}
            
            This PR was automatically generated by the benchmark workflow.
          branch: update-benchmarks
          delete-branch: true
          labels: |
            automated
            benchmarks
